<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1500"/>
      <stop offset="100%" stop-color="#142200"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2a0a"/>
      <stop offset="50%" stop-color="#2a3f10"/>
      <stop offset="100%" stop-color="#1a2a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- Left handle -->
  <rect x="72" y="148" width="30" height="120" rx="14" fill="url(#handle)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Handle grip texture -->
  <line x1="72" y1="180" x2="102" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="72" y1="196" x2="102" y2="196" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="72" y1="212" x2="102" y2="212" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="72" y1="228" x2="102" y2="228" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Handle neon accent ring -->
  <line x1="72" y1="165" x2="102" y2="165" stroke="#00ff87" stroke-width="3" opacity="0.7"/>
  <line x1="72" y1="248" x2="102" y2="248" stroke="#00ff87" stroke-width="3" opacity="0.7"/>
  <!-- Right handle -->
  <rect x="498" y="148" width="30" height="120" rx="14" fill="url(#handle)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="498" y1="180" x2="528" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="498" y1="196" x2="528" y2="196" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="498" y1="212" x2="528" y2="212" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="498" y1="228" x2="528" y2="228" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="498" y1="165" x2="528" y2="165" stroke="#00ff87" stroke-width="3" opacity="0.7"/>
  <line x1="498" y1="248" x2="528" y2="248" stroke="#00ff87" stroke-width="3" opacity="0.7"/>
  <!-- The rope - big U curve bottom -->
  <path d="M 102,208 Q 180,420 300,455 Q 420,420 498,208"
        fill="none" stroke="rgba(0,255,135,0.2)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 102,208 Q 180,415 300,448 Q 420,415 498,208"
        fill="none" stroke="#00ff87" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
  <!-- Small rotation arcs at handles -->
  <path d="M 87,130 Q 110,118 130,130" fill="none" stroke="rgba(0,255,135,0.4)" stroke-width="2" stroke-dasharray="3,3"/>
  <path d="M 470,130 Q 490,118 513,130" fill="none" stroke="rgba(0,255,135,0.4)" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Title -->
  <text x="300" y="508" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="28" fill="#00ff87" letter-spacing="1" filter="url(#glow)">PRO SPEED ROPE</text>
  <text x="300" y="534" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)" letter-spacing="4">KUGELLAGER · ALUMINIUM</text>
  <!-- Brand tag -->
  <text x="300" y="572" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 03</text>
</svg>
