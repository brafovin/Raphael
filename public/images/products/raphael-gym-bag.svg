<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#12122a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- Gym bag body -->
  <rect x="118" y="220" width="364" height="240" rx="22" fill="url(#bag)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Bag bottom panel -->
  <rect x="118" y="400" width="364" height="60" rx="0 0 22 22" fill="rgba(0,0,0,0.25)"/>
  <line x1="118" y1="400" x2="482" y2="400" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Zipper line top -->
  <line x1="148" y1="238" x2="452" y2="238" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Zipper pull -->
  <rect x="292" y="232" width="16" height="14" rx="2" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <!-- Side pocket left -->
  <rect x="118" y="270" width="55" height="120" rx="8 0 0 8" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Side pocket right -->
  <rect x="427" y="270" width="55" height="120" rx="0 8 8 0" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Handles -->
  <path d="M 218,220 Q 218,175 258,175 L 342,175 Q 382,175 382,220" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 218,220 Q 218,178 258,178 L 342,178 Q 378,178 382,220" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6" stroke-linecap="round"/>
  <!-- Brand patch on bag -->
  <rect x="212" y="298" width="176" height="64" rx="8" fill="rgba(0,255,135,0.06)" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="300" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="22" fill="#00ff87" letter-spacing="3" filter="url(#glow)">RAPHAEL</text>
  <text x="300" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="4">GYM BAG · 40L</text>
  <!-- Strap bottom -->
  <rect x="178" y="458" width="50" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <rect x="372" y="458" width="50" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <!-- Brand tag -->
  <text x="300" y="548" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 03</text>
</svg>
