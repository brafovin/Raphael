<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- Hoodie silhouette -->
  <path d="M 240,155 L 110,205 L 128,278 L 218,250 L 218,510 L 382,510 L 382,250 L 472,278 L 490,205 L 360,155 L 348,128 Q 325,72 300,68 Q 275,72 252,128 Z"
        fill="url(#fabric)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Hood detail -->
  <path d="M 252,128 Q 270,92 300,88 Q 330,92 348,128 Q 325,118 300,116 Q 275,118 252,128 Z"
        fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Kangaroo pocket -->
  <rect x="245" y="370" width="110" height="72" rx="4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Drawstrings -->
  <line x1="285" y1="145" x2="278" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <line x1="315" y1="145" x2="322" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Center chest design -->
  <text x="300" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="28" fill="#00ff87" letter-spacing="2" filter="url(#glow)">NO PAIN</text>
  <text x="300" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="28" fill="#00ff87" letter-spacing="2" filter="url(#glow)">NO GAIN</text>
  <!-- Brand tag -->
  <text x="300" y="552" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.25)" letter-spacing="5">RAPHAEL · DROP 01</text>
</svg>
