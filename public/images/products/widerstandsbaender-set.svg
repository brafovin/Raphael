<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#2d1a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- 5 resistance bands as overlapping ellipses (front view, fanned out) -->
  <!-- Band 5 - thickest - back -->
  <ellipse cx="300" cy="295" rx="140" ry="50" fill="none" stroke="#1a3a1a" stroke-width="28" opacity="0.8"/>
  <ellipse cx="300" cy="295" rx="140" ry="50" fill="none" stroke="rgba(0,80,0,0.6)" stroke-width="24"/>
  <!-- Band 4 -->
  <ellipse cx="300" cy="295" rx="118" ry="42" fill="none" stroke="#002800" stroke-width="22" opacity="0.9"/>
  <ellipse cx="300" cy="295" rx="118" ry="42" fill="none" stroke="rgba(0,100,20,0.7)" stroke-width="18"/>
  <!-- Band 3 -->
  <ellipse cx="300" cy="295" rx="96" ry="34" fill="none" stroke="#001a10" stroke-width="18" opacity="0.9"/>
  <ellipse cx="300" cy="295" rx="96" ry="34" fill="none" stroke="rgba(0,140,50,0.65)" stroke-width="14"/>
  <!-- Band 2 -->
  <ellipse cx="300" cy="295" rx="74" ry="26" fill="none" stroke="#001408" stroke-width="14" opacity="0.95"/>
  <ellipse cx="300" cy="295" rx="74" ry="26" fill="none" stroke="rgba(0,180,80,0.7)" stroke-width="10"/>
  <!-- Band 1 - thinnest - front -->
  <ellipse cx="300" cy="295" rx="52" ry="18" fill="none" stroke="#000a04" stroke-width="10"/>
  <ellipse cx="300" cy="295" rx="52" ry="18" fill="none" stroke="#00ff87" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
  <!-- Labels on the right side -->
  <text x="448" y="246" font-family="system-ui,sans-serif" font-size="11" fill="rgba(0,80,0,0.8)" letter-spacing="1">40 KG</text>
  <text x="436" y="262" font-family="system-ui,sans-serif" font-size="11" fill="rgba(0,100,20,0.8)" letter-spacing="1">30 KG</text>
  <text x="406" y="284" font-family="system-ui,sans-serif" font-size="11" fill="rgba(0,140,50,0.8)" letter-spacing="1">20 KG</text>
  <text x="385" y="306" font-family="system-ui,sans-serif" font-size="11" fill="rgba(0,180,80,0.8)" letter-spacing="1">10 KG</text>
  <text x="360" y="325" font-family="system-ui,sans-serif" font-size="11" fill="#00ff87" letter-spacing="1">5 KG</text>
  <!-- Title -->
  <text x="300" y="398" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="26" fill="#00ff87" letter-spacing="1" filter="url(#glow)">RESISTANCE SET</text>
  <text x="300" y="424" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)" letter-spacing="4">5 BÄNDER · NATURLATEX</text>
  <!-- Brand tag -->
  <text x="300" y="545" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 03</text>
</svg>
