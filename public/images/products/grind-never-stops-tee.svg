<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- Oversized T-shirt (wider cut) -->
  <path d="M 220,115 L 78,175 L 98,255 L 200,222 L 200,500 L 400,500 L 400,222 L 502,255 L 522,175 L 380,115 Q 362,108 350,98 Q 325,80 300,78 Q 275,80 250,98 Q 238,108 220,115 Z"
        fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>
  <!-- Lightning bolt -->
  <path d="M 308,248 L 290,302 L 305,302 L 292,358 L 318,295 L 300,295 L 318,248 Z" fill="#00ff87" opacity="0.85" filter="url(#glow)"/>
  <!-- Text -->
  <text x="300" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="24" fill="#00ff87" letter-spacing="0" filter="url(#glow)">GRIND NEVER</text>
  <text x="300" y="422" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="24" fill="#00ff87" letter-spacing="0" filter="url(#glow)">STOPS</text>
  <text x="300" y="452" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="4">OVERSIZED TEE</text>
  <!-- Brand tag -->
  <text x="300" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 01</text>
</svg>
