<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00101a"/>
      <stop offset="100%" stop-color="#001a28"/>
    </linearGradient>
    <linearGradient id="towel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2235"/>
      <stop offset="100%" stop-color="#061828"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- Rolled towel at top -->
  <ellipse cx="300" cy="185" rx="130" ry="32" fill="rgba(10,34,53,0.9)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <ellipse cx="300" cy="175" rx="130" ry="28" fill="#0f2d45" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Stripe on roll -->
  <path d="M 170,172 Q 300,158 430,172" fill="none" stroke="#00ff87" stroke-width="5" opacity="0.6"/>
  <path d="M 172,180 Q 300,166 428,180" fill="none" stroke="#00ff87" stroke-width="2" opacity="0.3"/>
  <!-- Towel unrolled below -->
  <rect x="162" y="185" width="276" height="290" rx="4" fill="url(#towel)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Towel texture lines -->
  <line x1="162" y1="225" x2="438" y2="225" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="162" y1="260" x2="438" y2="260" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="162" y1="295" x2="438" y2="295" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="162" y1="330" x2="438" y2="330" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="162" y1="365" x2="438" y2="365" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="162" y1="400" x2="438" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="162" y1="435" x2="438" y2="435" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Neon stripe -->
  <rect x="162" y="305" width="276" height="16" fill="rgba(0,255,135,0.08)" stroke="#00ff87" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Brand text on towel -->
  <text x="300" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="30" fill="#00ff87" letter-spacing="2" filter="url(#glow)">BEAST TOWEL</text>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.3)" letter-spacing="4">MIKROFASER · 70×140 CM</text>
  <!-- Bottom shadow -->
  <ellipse cx="300" cy="475" rx="138" ry="8" fill="rgba(0,0,0,0.4)"/>
  <!-- Brand tag -->
  <text x="300" y="545" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 03</text>
</svg>
