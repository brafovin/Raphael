<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a000d"/>
      <stop offset="100%" stop-color="#2d0017"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- Zip hoodie silhouette -->
  <path d="M 238,155 L 105,205 L 124,280 L 215,252 L 215,512 L 385,512 L 385,252 L 476,280 L 495,205 L 362,155 L 350,128 Q 328,70 300,66 Q 272,70 250,128 Z"
        fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>
  <!-- Hood -->
  <path d="M 250,128 Q 268,86 300,82 Q 332,86 350,128 Q 328,117 300,115 Q 272,117 250,128 Z"
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <!-- Center zip line -->
  <line x1="300" y1="160" x2="300" y2="512" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="4,6"/>
  <!-- Zip pull -->
  <rect x="294" y="200" width="12" height="18" rx="2" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Text on chest (left side) -->
  <text x="265" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="20" fill="#00ff87" letter-spacing="0" filter="url(#glow)">TRAIN</text>
  <text x="265" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="20" fill="#00ff87" letter-spacing="0" filter="url(#glow)">INSANE</text>
  <!-- Small dumbbell icon right chest -->
  <rect x="338" y="280" width="40" height="10" rx="3" fill="rgba(0,255,135,0.3)"/>
  <rect x="332" y="274" width="10" height="22" rx="3" fill="rgba(0,255,135,0.5)"/>
  <rect x="372" y="274" width="10" height="22" rx="3" fill="rgba(0,255,135,0.5)"/>
  <!-- Brand tag -->
  <text x="300" y="556" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 02</text>
</svg>
