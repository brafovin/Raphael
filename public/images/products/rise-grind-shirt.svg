<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#122012"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-opacity="0.03"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-opacity="0.03"/>
  <!-- T-shirt silhouette flat lay -->
  <path d="M 235,118 L 96,175 L 114,248 L 210,218 L 210,495 L 390,495 L 390,218 L 486,248 L 504,175 L 365,118 Q 348,112 338,102 Q 318,84 300,82 Q 282,84 262,102 Q 252,112 235,118 Z"
        fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
  <!-- Sunrise graphic -->
  <path d="M 265,295 Q 265,258 300,258 Q 335,258 335,295 Z" fill="#00ff87" opacity="0.7"/>
  <line x1="300" y1="248" x2="300" y2="238" stroke="#00ff87" stroke-width="2.5" opacity="0.6"/>
  <line x1="326" y1="256" x2="333" y2="248" stroke="#00ff87" stroke-width="2.5" opacity="0.6"/>
  <line x1="274" y1="256" x2="267" y2="248" stroke="#00ff87" stroke-width="2.5" opacity="0.6"/>
  <line x1="340" y1="272" x2="350" y2="268" stroke="#00ff87" stroke-width="2.5" opacity="0.6"/>
  <line x1="260" y1="272" x2="250" y2="268" stroke="#00ff87" stroke-width="2.5" opacity="0.6"/>
  <!-- Horizon line -->
  <line x1="248" y1="295" x2="352" y2="295" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="30" fill="#00ff87" letter-spacing="1" filter="url(#glow)">RISE &amp; GRIND</text>
  <text x="300" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.35)" letter-spacing="4">EVERYDAY. NO EXCUSES.</text>
  <!-- Brand tag -->
  <text x="300" y="540" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="11" fill="rgba(255,255,255,0.22)" letter-spacing="5">RAPHAEL · DROP 01</text>
</svg>
